# Route 1: HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-http-redirect
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "zenbu-roadmaps.name" . }}-gateway
      namespace: {{ .Values.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.domain }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Route 2: HTTPS main traffic
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-https
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "zenbu-roadmaps.name" . }}-gateway
      namespace: {{ .Values.namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.domain }}
  rules:
    # /api/* → API service
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "zenbu-roadmaps.name" . }}-api
          port: {{ .Values.api.port }}
      timeouts:
        request: 120s
        backendRequest: 120s
    # /* → Web service (SPA)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "zenbu-roadmaps.name" . }}-web
          port: {{ .Values.web.port }}
