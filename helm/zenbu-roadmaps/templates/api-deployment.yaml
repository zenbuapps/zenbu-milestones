apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "zenbu-roadmaps.name" . }}-api
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "zenbu-roadmaps.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "zenbu-roadmaps.name" . }}-api
      annotations:
        # 把 secret.yaml 渲染後的 SHA-256 hash 烙進 pod template。
        # K8s Secret 的 stringData 透過 helm value 傳入，純改 secret 不會
        # 動到 deployment template 文字 → helm 不認為要 rollout pod →
        # pod 沿用啟動時的 env var 快照，新 secret 永遠讀不到。
        # 這個 annotation 讓 secret 內容變動同步反映到 template hash，
        # 強制 helm upgrade 觸發 pod rollout。
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: ghcr-login
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            {{- range $key, $val := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $_ := .Values.api.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "zenbu-roadmaps.name" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
