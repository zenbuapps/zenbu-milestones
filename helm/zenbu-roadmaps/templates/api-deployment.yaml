apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "zenbu-roadmaps.name" . }}-api
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "zenbu-roadmaps.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "zenbu-roadmaps.name" . }}-api
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: ghcr-login
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            {{- range $key, $val := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $_ := .Values.api.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "zenbu-roadmaps.name" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
