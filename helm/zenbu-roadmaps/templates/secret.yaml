apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.api.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
