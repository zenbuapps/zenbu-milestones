{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "zenbu-roadmaps.name" . }}-postgresql
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "zenbu-roadmaps.name" . }}-postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zenbu-roadmaps.name" . }}-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "zenbu-roadmaps.name" . }}-postgresql
    {{- include "zenbu-roadmaps.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zenbu-roadmaps.name" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "zenbu-roadmaps.name" . }}-postgresql
  template:
    metadata:
      labels:
        app: {{ include "zenbu-roadmaps.name" . }}-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
